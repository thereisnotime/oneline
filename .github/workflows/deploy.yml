name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy README to docs
        run: cp README.md docs/

      - name: Inject build info into index.html
        run: |
          SHA=$(git rev-parse --short HEAD)
          TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)"
          sed -i "s|<!-- BUILD_SHA -->|<a href=\"${COMMIT_URL}\">${SHA}</a>|g" docs/index.html
          sed -i "s|<!-- BUILD_TIME -->|${TIME}|g" docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
